name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    name: Go (fmt / vet / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Fyne dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for: $unformatted"
            exit 1
          fi

      - name: vet
        # Surfaces the vet finding as an annotation so the failure is readable
        # without being able to open the raw job logs.
        run: |
          set +e
          out=$(go vet ./... 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            detail=$(printf '%s' "$out" | head -40 | tr '\n' ' ' | head -c 1500)
            echo "::error title=go vet rc=$rc::[$detail]"
          fi
          exit "$rc"

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 ./...
